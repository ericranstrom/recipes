site_name: Recipes
site_description: A personal collection of tested recipes and reusable kitchen building blocks.
site_url: https://ericranstrom.github.io/recipes/
repo_url: https://github.com/ericranstrom/recipes
repo_name: ericranstrom/recipes
edit_uri: ""

theme:
  name: material
  custom_dir: overrides
  icon:
    logo: material/silverware-fork-knife
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow
    # content.action.edit is intentionally NOT enabled (no "edit this page" button).

plugins:
  - search
  - tags:
      # Enforced tag vocabulary. Must match the list in CLAUDE.md.
      # A tag not listed here fails the build.
      tags_allowed:
        # Protein
        - chicken
        - beef
        - pork
        - lamb
        - turkey
        - fish
        - shellfish
        - eggs
        - tofu
        - beans
        # Diet
        - vegetarian
        - vegan
        - gluten-free
        - dairy-free
        # Cuisine
        - american
        - mexican
        - italian
        - french
        - mediterranean
        - middle-eastern
        - indian
        - chinese
        - japanese
        - korean
        - thai
        - vietnamese
        # Meal type
        - breakfast
        - lunch
        - dinner
        - side
        - salad
        - dessert
        - snack
        - component
        # Effort
        - weeknight
        - project
        # Planning
        - make-ahead

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.smartsymbols

extra:
  generator: false
